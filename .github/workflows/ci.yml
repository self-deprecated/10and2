# The 10and2 package's checks, on every push and pull request: `npm run check` (types, tests, the bundles and their
# smoke test) on Linux, macOS and Windows with Node 22 and 24, the built package on Node 22.13 (the oldest package.json
# allows), and the Nix package on Linux and macOS. Like the rest of this repository, exported with each release from Self-Deprecated's
# own, where the connector is also tested against the service.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main is checked to the end; a pull request's older run stops when it's pushed again.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: npm run check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # What npm installs runs on any Node from 22.13: the bundles just built, on exactly that one.
      - if: matrix.node == 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - if: matrix.node == 22
        name: test/smoke.mjs on Node 22.13
        run: node --version && node test/smoke.mjs

  nix:
    name: nix run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      # What `nix run github:self-deprecated/10and2` does: build the package and start it.
      - run: nix run -L . -- version
